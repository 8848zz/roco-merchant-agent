name: Merchant Push Notification

on:
  schedule:
    - cron: '5 0,1,4,5,8,9,12,13 * * *'
    - cron: '45 1 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install requests beautifulsoup4 lxml
      - run: python scripts/notify_merchant.py
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
